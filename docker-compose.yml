x-app-environment: &app-environment
  NEON_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-ausbildung_dev_password}@postgres:5432/ausbildung
  JWT_SECRET: ${JWT_SECRET}
  SMTP_ENCRYPTION_KEY: ${SMTP_ENCRYPTION_KEY}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
  APP_URL: ${APP_URL:-http://localhost:8000}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  REDIS_URL: redis://redis:6379
  CRON_SECRET: ${CRON_SECRET:-}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  BANK_ACCOUNT_HOLDER: ${BANK_ACCOUNT_HOLDER:-}
  BANK_NAME: ${BANK_NAME:-}
  BANK_RIB: ${BANK_RIB:-}
  BANK_IBAN: ${BANK_IBAN:-}
  BANK_BIC: ${BANK_BIC:-}
  BANK_TRANSFER_INSTRUCTIONS: ${BANK_TRANSFER_INSTRUCTIONS:-}
  BILLING_ADMIN_EMAIL: ${BILLING_ADMIN_EMAIL:-}
  SYSTEM_SMTP_HOST: ${SYSTEM_SMTP_HOST:-}
  SYSTEM_SMTP_PORT: ${SYSTEM_SMTP_PORT:-587}
  SYSTEM_SMTP_SECURE: ${SYSTEM_SMTP_SECURE:-false}
  SYSTEM_SMTP_USER: ${SYSTEM_SMTP_USER:-}
  SYSTEM_SMTP_PASSWORD: ${SYSTEM_SMTP_PASSWORD:-}
  SYSTEM_SMTP_FROM_EMAIL: ${SYSTEM_SMTP_FROM_EMAIL:-}
  SYSTEM_SMTP_FROM_NAME: ${SYSTEM_SMTP_FROM_NAME:-Azubora}

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # Auto-apply bot, IMAP inbox sync and subscription expiry. Run exactly one.
  worker:
    build: .
    command: ["python", "manage.py", "run_scheduler"]
    environment: *app-environment
    depends_on:
      web:
        condition: service_healthy
    restart: always

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=ausbildung
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ausbildung_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ausbildung"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
